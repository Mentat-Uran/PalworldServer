services:
  palworld-server:
    # Pinned from the locally verified 2026-07-23 image. Update intentionally;
    # do not silently follow a mutable latest tag.
    image: thijsvanloef/palworld-server-docker@sha256:401d3eb5c053bcd72949e1ede8c4e38be5e5ad66be7272ac37940706df0aeb2f
    container_name: palworld-server
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - target: ${PORT:-8211}        # 游戏端口 UDP
        published: ${PORT:-8211}
        protocol: udp
      - target: ${REST_API_PORT:-8212}  # REST 管理端口 TCP，仅本机
        published: ${REST_API_PORT:-8212}
        host_ip: 127.0.0.1
        protocol: tcp
    env_file:
      - .env
    volumes:
      - ./data:/palworld/
    # The public default intentionally has no hard memory cap. A host with
    # less than 16 GiB available memory is below the recommended baseline.
    # Put optional CPU/memory limits in docker-compose.override.yml.
